apiVersion: v1
kind: ServiceAccount
metadata:
  name: airflow
  namespace: lakehouse
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-pod-runner
  namespace: lakehouse
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-pod-runner
  namespace: lakehouse
subjects:
  - kind: ServiceAccount
    name: airflow
    namespace: lakehouse
roleRef:
  kind: Role
  name: airflow-pod-runner
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Secret
metadata:
  name: airflow-secret
  namespace: lakehouse
type: Opaque
stringData:
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: mysql+mysqldb://airflow:airflow123@mysql:3306/airflow
  AIRFLOW__CORE__FERNET_KEY: kFgWcNje7rg0OzzNvO5cpa7WvlV1a0cyhS4FV3ac_6s=
  AIRFLOW__WEBSERVER__SECRET_KEY: 5680908d1fa92a16d10be094a0cdbcd0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow
  namespace: lakehouse
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: airflow
  template:
    metadata:
      labels:
        app: airflow
    spec:
      serviceAccountName: airflow
      enableServiceLinks: false
      initContainers:
        - name: db-init
          image: apache/airflow:2.11.2
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c"]
          args:
            - |
              airflow db migrate && { airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true; }
          envFrom:
            - secretRef:
                name: airflow-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
        - name: copy-dags
          image: apache/airflow:2.11.2
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c"]
          args:
            - cp -L /dag-src/*.py /opt/airflow/dags/ && ls -la /opt/airflow/dags
          volumeMounts:
            - name: dag-src
              mountPath: /dag-src
            - name: dags
              mountPath: /opt/airflow/dags
      containers:
        - name: webserver
          image: apache/airflow:2.11.2
          imagePullPolicy: IfNotPresent
          args: ["webserver"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: airflow-secret
          env:
            - name: AIRFLOW__CORE__EXECUTOR
              value: LocalExecutor
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "False"
            - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
              value: "False"
            - name: AIRFLOW__WEBSERVER__WORKERS
              value: "1"
            - name: AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE
              value: Asia/Ho_Chi_Minh
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1536Mi
          volumeMounts:
            - name: dags
              mountPath: /opt/airflow/dags
            - name: logs
              mountPath: /opt/airflow/logs
        - name: scheduler
          image: apache/airflow:2.11.2
          imagePullPolicy: IfNotPresent
          args: ["scheduler"]
          envFrom:
            - secretRef:
                name: airflow-secret
          env:
            - name: AIRFLOW__CORE__EXECUTOR
              value: LocalExecutor
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "False"
            - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
              value: "False"
            - name: AIRFLOW__CORE__PARALLELISM
              value: "4"
            - name: AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL
              value: "30"
            - name: AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL
              value: "30"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: dags
              mountPath: /opt/airflow/dags
            - name: logs
              mountPath: /opt/airflow/logs
      volumes:
        - name: dag-src
          configMap:
            name: airflow-dags
        - name: dags
          emptyDir: {}
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: airflow
  namespace: lakehouse
spec:
  selector:
    app: airflow
  ports:
    - name: http
      port: 8080
      targetPort: http
